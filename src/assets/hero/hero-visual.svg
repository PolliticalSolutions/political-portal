<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F8FB"/>
      <stop offset="1" stop-color="#E9EFF5"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="softShadow" x="-30" y="-30" width="1260" height="760" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0D1925" flood-opacity="0.12"/>
    </filter>
    <filter id="cardShadow" x="-30" y="-30" width="600" height="340" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0D1925" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="40" y="40" width="1120" height="620" rx="28" fill="url(#bg)" filter="url(#softShadow)"/>
  <rect x="70" y="70" width="1060" height="560" rx="24" fill="url(#panel)" stroke="#D6E0EA"/>

