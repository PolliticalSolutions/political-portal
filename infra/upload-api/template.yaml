AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Political Solutions upload API (HTTP API + Lambda + S3 + DynamoDB).

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Description: SPA origins allowed by CORS (e.g. https://www.politicalsolutions.uk,http://localhost:5173).
  CognitoIssuer:
    Type: String
    Default: ""
    Description: Cognito issuer URL for JWT verification (e.g. https://cognito-idp.eu-west-2.amazonaws.com/<user-pool-id>).
  CognitoAudience:
    Type: String
    Default: ""
    Description: Cognito app client ID for JWT verification.
  AdminSubAllowlist:
    Type: String
    Default: ""
    Description: Comma-separated Cognito sub allowlist for admin endpoints.
  GeoLookupTableName:
    Type: String
    Default: ""
    Description: Existing geography lookup DynamoDB table name (PCON/WD mapping), managed outside this stack.
  EnableGuardDutyScan:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable GuardDuty Malware Protection for S3 scan gating.
  BypassScanWhenDisabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enqueue jobs directly when GuardDuty scan gating is disabled.
  AlarmTopicArn:
    Type: String
    Default: ""
    Description: Optional SNS topic ARN for CloudWatch alarms.
  ThrottlingRateLimit:
    Type: Number
    Default: 20
    Description: Steady-state request rate per second for the HTTP API stage.
  ThrottlingBurstLimit:
    Type: Number
    Default: 40
    Description: Burst limit for the HTTP API stage.
  WafEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable or disable AWS WAF protection.
  WafRateLimit:
    Type: Number
    Default: 300
    Description: WAF rate limit (requests per 5 minutes per IP).
  WafManagedRulesEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable or disable AWS Managed Rule Groups.
  WafLoggingEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable or disable WAF logging to CloudWatch Logs.
  WafLogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch Logs retention in days for WAF logs.
  NotificationEmail:
    Type: String
    Default: "paul@politicalsolutions.uk"
    Description: Recipient email address for job completion notifications.
  SesFromEmail:
    Type: String
    Default: "noreply@politicalsolutions.uk"
    Description: SES sender address for job completion notifications.
  SupabaseUrl:
    Type: String
    Default: ""
    Description: Supabase project URL for elections sync and filtered election reads.
  SupabaseServiceKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Supabase service-role key for elections sync and filtered election reads.
  TesseractLayerArn:
    Type: String
    Default: ""
    Description: ARN of the Tesseract + poppler Lambda layer (built via build_layer.sh and published manually).
  OcrEvidenceOnlyGapInference:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Suppress sequence-only OCR gap rows while retaining visually evidenced inference.
  OcrRowEligibilityFilter:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Apply election-specific row eligibility rules and suppress unreadable strikethrough inference.
  SesRecipientEmail:
    Type: String
    Default: "markedregisters@politicalsolutions.uk"
    Description: Recipient email for processed marked register notifications.
  VolunteerTokenSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: HMAC-SHA256 secret for volunteer RSVP and unsubscribe JWT tokens.
  PlatformBaseUrl:
    Type: String
    Default: "https://politicalsolutions.uk"
    Description: Base URL for volunteer RSVP and unsubscribe links in emails.
  CampaignsFromEmail:
    Type: String
    Default: "campaigns@politicalsolutions.uk"
    Description: SES sender for weekly volunteer campaign emails.
  HealthAlertSenderEmail:
    Type: String
    Default: "paul@politicalsolutions.uk"
    Description: SES verified sender address for System Health alert emails.
  HealthAlertRecipientEmail:
    Type: String
    Default: "paul@politicalsolutions.uk"
    Description: Recipient address for System Health alert emails.

Conditions:
  WafEnabledCondition: !Equals [!Ref WafEnabled, "true"]
  WafManagedRulesEnabledCondition: !Equals [!Ref WafManagedRulesEnabled, "true"]
  GeoLookupConfigured: !Not [!Equals [!Ref GeoLookupTableName, ""]]
  WafLoggingOn: !And
    - !Condition WafEnabledCondition
    - !Equals [!Ref WafLoggingEnabled, "true"]
  AlarmActionsEnabled: !Not [!Equals [!Ref AlarmTopicArn, ""]]
  GuardDutyScanEnabled: !Equals [!Ref EnableGuardDutyScan, "true"]
  GuardDutyScanDisabled: !Not [!Condition GuardDutyScanEnabled]
  TesseractLayerConfigured: !Not [!Equals [!Ref TesseractLayerArn, ""]]

Resources:

  # ── S3 bucket (uploads + outputs) ─────────────────────────────────────────

  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-uploads-${AWS::AccountId}"
      AccessControl: Private
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref AllowedOrigins
            AllowedMethods: [POST, GET]
            AllowedHeaders: ["*"]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadsAfter90Days
            Status: Enabled
            Prefix: "uploads/"
            ExpirationInDays: 90
          - Id: ExpireOutputsAfter90Days
            Status: Enabled
            Prefix: "outputs/"
            ExpirationInDays: 90
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      NotificationConfiguration: !If
        - GuardDutyScanDisabled
        - LambdaConfigurations:
            - Event: "s3:ObjectCreated:*"
              Function: !GetAtt UploadCompleteFunction.Arn
              Filter:
                S3Key:
                  Rules:
                    - Name: prefix
                      Value: "uploads/"
        - !Ref AWS::NoValue

  # ── DynamoDB table ─────────────────────────────────────────────────────────

  JobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-jobs"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
        - AttributeName: userSub
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: s3Key
          AttributeType: S
        - AttributeName: manualReviewKey
          AttributeType: S
        - AttributeName: batchId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserSubIndex
          KeySchema:
            - AttributeName: userSub
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: S3KeyIndex
          KeySchema:
            - AttributeName: s3Key
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: ManualReviewIndex
          KeySchema:
            - AttributeName: manualReviewKey
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: BatchIdIndex
          KeySchema:
            - AttributeName: batchId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true


  PersonaJobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-persona-jobs"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-users"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusCreatedAtIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ElectionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-elections"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: electionId
          AttributeType: S
        - AttributeName: statusPconKey
          AttributeType: S
        - AttributeName: dateElectionKey
          AttributeType: S
      KeySchema:
        - AttributeName: electionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusPconDateIndex
          KeySchema:
            - AttributeName: statusPconKey
              KeyType: HASH
            - AttributeName: dateElectionKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  OrganisationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-organisations"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: orgId
          AttributeType: S
        - AttributeName: activeOrgTypeKey
          AttributeType: S
      KeySchema:
        - AttributeName: orgId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ActiveOrgTypeIndex
          KeySchema:
            - AttributeName: activeOrgTypeKey
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AuditLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-audit-log"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: auditId
          AttributeType: S
        - AttributeName: actorId
          AttributeType: S
        - AttributeName: targetKey
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: auditId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ActorCreatedAtIndex
          KeySchema:
            - AttributeName: actorId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: TargetCreatedAtIndex
          KeySchema:
            - AttributeName: targetKey
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  SubmissionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-submissions"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: submissionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: submissionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdCreatedAtIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── Processing queues (scan-gated) ────────────────────────────────────────

  ProcessDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-process-dlq"
      MessageRetentionPeriod: 1209600

  ProcessQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-process-queue"
      # 960s > the 900s Lambda timeout, so an in-flight chunk can never be
      # redelivered while still processing, but a failed/throttled chunk
      # resurfaces in ~16 minutes rather than 12 hours. Chunking multiplies
      # message volume ~8x, so slow failure surfacing is no longer acceptable.
      VisibilityTimeout: 960
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProcessDLQ.Arn
        maxReceiveCount: 3

  # ── HTTP API ───────────────────────────────────────────────────────────────

  UploadApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods:
          - GET
          - POST
          - PUT
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottlingRateLimit
        ThrottlingBurstLimit: !Ref ThrottlingBurstLimit

  # ── WAF ────────────────────────────────────────────────────────────────────

  UploadWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: WafEnabledCondition
    Properties:
      Name: !Sub "${AWS::StackName}-upload-waf"
      Description: WAF protections for the upload HTTP API.
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: upload-waf
        SampledRequestsEnabled: true
      Rules:
        - Name: RateLimitPerIP
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimit
              AggregateKeyType: IP
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: upload-waf-rate-limit
            SampledRequestsEnabled: true
        - !If
          - WafManagedRulesEnabledCondition
          - Name: AWSManagedRulesCommonRuleSet
            Priority: 1
            OverrideAction:
              None: {}
            Statement:
              ManagedRuleGroupStatement:
                VendorName: AWS
                Name: AWSManagedRulesCommonRuleSet
            VisibilityConfig:
              CloudWatchMetricsEnabled: true
              MetricName: upload-waf-common
              SampledRequestsEnabled: true
          - !Ref AWS::NoValue
        - !If
          - WafManagedRulesEnabledCondition
          - Name: AWSManagedRulesKnownBadInputsRuleSet
            Priority: 2
            OverrideAction:
              None: {}
            Statement:
              ManagedRuleGroupStatement:
                VendorName: AWS
                Name: AWSManagedRulesKnownBadInputsRuleSet
            VisibilityConfig:
              CloudWatchMetricsEnabled: true
              MetricName: upload-waf-bad-inputs
              SampledRequestsEnabled: true
          - !Ref AWS::NoValue
        - !If
          - WafManagedRulesEnabledCondition
          - Name: AWSManagedRulesAmazonIpReputationList
            Priority: 3
            OverrideAction:
              None: {}
            Statement:
              ManagedRuleGroupStatement:
                VendorName: AWS
                Name: AWSManagedRulesAmazonIpReputationList
            VisibilityConfig:
              CloudWatchMetricsEnabled: true
              MetricName: upload-waf-ip-reputation
              SampledRequestsEnabled: true
          - !Ref AWS::NoValue

  UploadWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: WafEnabledCondition
    Properties:
      WebACLArn: !GetAtt UploadWebAcl.Arn
      ResourceArn: !Sub "arn:aws:apigateway:${AWS::Region}::/apis/${UploadApi}/stages/$default"

  UploadWafLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: WafLoggingOn
    Properties:
      LogGroupName: !Sub "/aws/waf/${AWS::StackName}"
      RetentionInDays: !Ref WafLogRetentionDays

  UploadWafLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Condition: WafLoggingOn
    Properties:
      ResourceArn: !GetAtt UploadWebAcl.Arn
      LogDestinationConfigs:
        - !GetAtt UploadWafLogGroup.Arn

  # ── API Lambda ─────────────────────────────────────────────────────────────

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.handler
      Runtime: nodejs24.x
      Timeout: 29
      MemorySize: 256
      Environment:
        Variables:
          ALLOWED_ORIGINS: !Join [",", !Ref AllowedOrigins]
          JOBS_TABLE: !Ref JobsTable
          USERS_TABLE: !Ref UsersTable
          ELECTIONS_TABLE: !Ref ElectionsTable
          SUBMISSIONS_TABLE: !Ref SubmissionsTable
          ORGANISATIONS_TABLE: !Ref OrganisationsTable
          AUDIT_TABLE: !Ref AuditLogTable
          GEO_LOOKUP_TABLE: !Ref GeoLookupTableName
          GEO_LOOKUP_MODE: "auto"
          GEO_LOOKUP_WARD_KEY_ATTR: "wardCode"
          GEO_LOOKUP_PCON_ATTR: "pconCode"
          GEO_LOOKUP_PK_ATTR: "pk"
          GEO_LOOKUP_SK_ATTR: "sk"
          GEO_LOOKUP_WARD_PK_PREFIX: "WARD#"
          UPLOADS_BUCKET: !Ref UploadsBucket
          COGNITO_ISSUER: !Ref CognitoIssuer
          COGNITO_AUDIENCE: !Ref CognitoAudience
          ADMIN_SUB_ALLOWLIST: !Ref AdminSubAllowlist
          ENABLE_GUARDDUTY_SCAN: !Ref EnableGuardDutyScan
          BYPASS_SCAN_WHEN_DISABLED: !Ref BypassScanWhenDisabled
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_KEY: !Ref SupabaseServiceKey
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:DeleteItem
            Resource:
              - !GetAtt JobsTable.Arn
              - !Sub "${JobsTable.Arn}/index/UserSubIndex"
              - !Sub "${JobsTable.Arn}/index/S3KeyIndex"
              - !Sub "${JobsTable.Arn}/index/ManualReviewIndex"
              - !Sub "${JobsTable.Arn}/index/BatchIdIndex"
              - !GetAtt UsersTable.Arn
              - !Sub "${UsersTable.Arn}/index/StatusCreatedAtIndex"
              - !GetAtt ElectionsTable.Arn
              - !Sub "${ElectionsTable.Arn}/index/StatusPconDateIndex"
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:Scan
            Resource:
              - !GetAtt ElectionsTable.Arn
              - !GetAtt SubmissionsTable.Arn
              - !Sub "${SubmissionsTable.Arn}/index/UserIdCreatedAtIndex"
              - !GetAtt OrganisationsTable.Arn
              - !Sub "${OrganisationsTable.Arn}/index/ActiveOrgTypeIndex"
              - !GetAtt AuditLogTable.Arn
        - !If
          - GeoLookupConfigured
          - Statement:
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${GeoLookupTableName}"
          - !Ref AWS::NoValue
        - Statement:
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource: !Sub "${UploadsBucket.Arn}/*"
        - Statement:
            Effect: Allow
            Action:
              - cognito-idp:AdminCreateUser
              - cognito-idp:AdminSetUserPassword
            Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/eu-west-2_rLrUAqYiJ"
        - Statement:
            Effect: Allow
            Action:
              - ses:SendEmail
            Resource: "*"
      Events:
        JobsPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /jobs
            Method: POST
        JobsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /jobs
            Method: GET
        JobsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /jobs/{jobId}
            Method: GET
        JobsDownload:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /jobs/{jobId}/download
            Method: GET
        ElectionsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /elections
            Method: GET
        OrganisationsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /organisations
            Method: GET
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /me
            Method: GET
        Apply:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /apply
            Method: POST
        OnboardingSignup:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /onboarding/signup
            Method: POST
        AdminElectionsCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/elections
            Method: POST
        AdminElectionsUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/elections/{electionId}
            Method: PUT
        AdminElectionsArchive:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/elections/{electionId}/archive
            Method: POST
        AdminElectionsSync:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/elections/sync
            Method: POST
        AdminMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/me
            Method: GET
        AdminUsersList:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/users
            Method: GET
        AdminUserApprove:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/users/{userId}/approve
            Method: POST
        AdminUserReject:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/users/{userId}/reject
            Method: POST
        ManualReviewJobsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/manual-review/jobs
            Method: GET
        ManualReviewJobGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/manual-review/jobs/{jobId}
            Method: GET
        ManualReviewJobResolve:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/manual-review/jobs/{jobId}/resolve
            Method: POST

  # ── Worker Lambda (S3 trigger) ─────────────────────────────────────────────

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: worker.handler
      Runtime: nodejs24.x
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          USERS_TABLE: !Ref UsersTable
          ELECTIONS_TABLE: !Ref ElectionsTable
          SUBMISSIONS_TABLE: !Ref SubmissionsTable
          GEO_LOOKUP_TABLE: !Ref GeoLookupTableName
          UPLOADS_BUCKET: !Ref UploadsBucket
          SES_FROM_EMAIL: !Ref SesFromEmail
          NOTIFICATION_EMAIL: !Ref NotificationEmail
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:UpdateItem
            Resource: !GetAtt JobsTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:Query
            Resource:
              - !Sub "${JobsTable.Arn}/index/S3KeyIndex"
        - Statement:
            Effect: Allow
            Action:
              - s3:HeadObject
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "${UploadsBucket.Arn}/*"
        - Statement:
            Effect: Allow
            Action:
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:ChangeMessageVisibility
            Resource: !GetAtt ProcessQueue.Arn
        - Statement:
            Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: "*"

  WorkerProcessQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 10
      EventSourceArn: !GetAtt ProcessQueue.Arn
      FunctionName: !Ref WorkerFunction
      FunctionResponseTypes:
        - ReportBatchItemFailures
      Enabled: false  # Local listener (scripts/listener/listener.py) is the sole consumer

  # ── Upload complete handler (S3 -> Lambda -> DynamoDB -> SQS) ────────────
  # Triggered by S3 ObjectCreated when GuardDuty scan gating is disabled.
  # Looks up the job by s3Key in DynamoDB, then enqueues a formatted message
  # (with jobId) on the ProcessQueue for the local listener to consume.

  UploadCompleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: uploadCompleteHandler.handler
      Runtime: nodejs24.x
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          PROCESS_QUEUE_URL: !Ref ProcessQueue
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
            Resource:
              - !GetAtt JobsTable.Arn
              - !Sub "${JobsTable.Arn}/index/S3KeyIndex"
        - Statement:
            Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt ProcessQueue.Arn

  UploadCompleteFunctionS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref UploadCompleteFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${AWS::StackName}-uploads-${AWS::AccountId}"

  # ── Scan result handler (GuardDuty -> EventBridge -> Lambda -> SQS) ───────

  ScanResultHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: scanResultHandler.handler
      Runtime: nodejs24.x
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          USERS_TABLE: !Ref UsersTable
          ELECTIONS_TABLE: !Ref ElectionsTable
          SUBMISSIONS_TABLE: !Ref SubmissionsTable
          GEO_LOOKUP_TABLE: !Ref GeoLookupTableName
          PROCESS_QUEUE_URL: !Ref ProcessQueue
          UPLOADS_BUCKET: !Ref UploadsBucket
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:Query
            Resource:
              - !GetAtt JobsTable.Arn
              - !Sub "${JobsTable.Arn}/index/S3KeyIndex"
        - Statement:
            Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt ProcessQueue.Arn

  ScanResultsRule:
    Type: AWS::Events::Rule
    Condition: GuardDutyScanEnabled
    Properties:
      Description: Route GuardDuty malware scan results for upload objects.
      EventPattern:
        source:
          - aws.guardduty
        detail-type:
          - GuardDuty Malware Protection Object Scan Result
        detail:
          s3ObjectDetails:
            bucketName:
              - !Ref UploadsBucket
      Targets:
        - Arn: !GetAtt ScanResultHandlerFunction.Arn
          Id: ScanResultHandlerTarget

  ScanResultHandlerInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: GuardDutyScanEnabled
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ScanResultHandlerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScanResultsRule.Arn

  # ── GuardDuty Malware Protection plan for uploads/ prefix ─────────────────

  MalwareProtectionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: malware-protection-plan.guardduty.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GuardDutyMalwareProtectionS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObjectTagging
                  - s3:PutObjectVersionTagging
                Resource:
                  - !Sub "${UploadsBucket.Arn}/uploads/*"
              - Effect: Allow
                Action:
                  - s3:GetBucketNotification
                  - s3:PutBucketNotification
                  - s3:GetBucketNotificationConfiguration
                  - s3:PutBucketNotificationConfiguration
                  - s3:GetBucketLocation
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                Resource: !GetAtt UploadsBucket.Arn
              - Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:PutTargets
                  - events:RemoveTargets
                Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*"
              - Effect: Allow
                Action:
                  - events:DescribeRule
                  - events:ListTargetsByRule
                Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${UploadsBucket.Arn}/malware-protection-resource-validation-object"

  UploadsMalwareProtectionPlan:
    Type: AWS::GuardDuty::MalwareProtectionPlan
    Condition: GuardDutyScanEnabled
    Properties:
      Role: !GetAtt MalwareProtectionRole.Arn
      ProtectedResource:
        S3Bucket:
          BucketName: !Ref UploadsBucket
          ObjectPrefixes:
            - "uploads/"
      Actions:
        Tagging:
          Status: ENABLED

  # ── MP Persona Generator ─────────────────────────────────────────────────────
  # API Gateway starts/polls short-lived jobs; this Lambda self-invokes
  # asynchronously for the long-running scraping + Claude pipeline.

  PersonaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: personaHandler.handler
      Runtime: nodejs24.x
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          ALLOWED_ORIGINS: !Join [",", !Ref AllowedOrigins]
          ANTHROPIC_API_KEY: ""  # Set manually in Lambda console after deploy
          PERSONA_JOBS_TABLE: !Ref PersonaJobsTable
          PERSONA_JOB_TTL_SECONDS: "86400"
          PERSONA_MAX_SYSTEM_PROMPT_CHARS: "120000"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt PersonaJobsTable.Arn
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-*"
      Events:
        PersonaStart:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /persona
            Method: POST
        PersonaGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /persona/{jobId}
            Method: GET

  PersonaFunctionAsyncInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref PersonaFunction
      Qualifier: "$LATEST"
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 3600

  # ── Volunteer public ops (signup, membership-check, rsvp, unsubscribe) ─────
  # Four public HTTP routes for the Campaign Sessions & Volunteer module.
  # Reads/writes the volunteers and volunteer_rsvps tables via Supabase
  # service-role REST. RSVP/unsubscribe routes verify HMAC-SHA256 JWTs.

  VolunteerOpsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: volunteerOps.handler
      Runtime: nodejs24.x
      Timeout: 29
      MemorySize: 256
      Environment:
        Variables:
          ALLOWED_ORIGINS: !Join [",", !Ref AllowedOrigins]
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_KEY: !Ref SupabaseServiceKey
          VOLUNTEER_TOKEN_SECRET: !Ref VolunteerTokenSecret
          PLATFORM_BASE_URL: !Ref PlatformBaseUrl
      Events:
        VolunteerSignup:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /volunteer/signup
            Method: POST
        VolunteerMembershipCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /volunteer/membership-check
            Method: POST
        VolunteerRsvp:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /volunteer/rsvp
            Method: POST
        VolunteerUnsubscribe:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /volunteer/unsubscribe
            Method: GET

  # ── By-Election Monitor ──────────────────────────────────────────────────────
  # Scheduled Lambda that polls the Parliament Members API daily at 06:00 UTC,
  # detects recently departed Commons members, and writes political_alerts rows.

  ByElectionMonitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: byElectionMonitor.handler
      Runtime: nodejs24.x
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_KEY: !Ref SupabaseServiceKey
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 6 * * ? *)
            Description: Daily by-election trigger check at 06:00 UTC
            Enabled: true

  # ── Attendance Risk Refresh ──────────────────────────────────────────────────
  # Runs every Monday at 07:00 UTC. Re-scores councillor attendance against the
  # Section 85 LGA 1972 thresholds and inserts political_alerts for critical/vacant.
  # Safe to re-run — deduplicates by title + local_authority_id + is_active.

  AttendanceRiskRefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: attendanceRiskRefresh.handler
      Runtime: nodejs22.x
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_KEY: !Ref SupabaseServiceKey
      Events:
        WeeklyMonday:
          Type: Schedule
          Properties:
            Schedule: cron(0 7 ? * MON *)
            Description: Weekly attendance risk refresh every Monday at 07:00 UTC
            Enabled: true

  # ── Volunteer Email — scheduled weekly campaign-session digest ──────────
  # Runs every Monday at 08:00 UTC. Sends a personalised email to every
  # approved+opted-in volunteer listing published sessions in their region
  # for the next 7 days, with tokenised RSVP and unsubscribe links.

  VolunteerEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: volunteerEmail.handler
      Runtime: nodejs24.x
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_KEY: !Ref SupabaseServiceKey
          VOLUNTEER_TOKEN_SECRET: !Ref VolunteerTokenSecret
          PLATFORM_BASE_URL: !Ref PlatformBaseUrl
          CAMPAIGNS_FROM_EMAIL: !Ref CampaignsFromEmail
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: "*"
      Events:
        WeeklyMonday:
          Type: Schedule
          Properties:
            Schedule: cron(0 8 ? * MON *)
            Description: Weekly volunteer campaign email send every Monday at 08:00 UTC
            Enabled: true

  # ── System Health Check ─────────────────────────────────────────────────────
  # Polls CloudWatch (Lambda errors/invocations + DynamoDB SystemErrors),
  # SQS queue depth/age, and Supabase REST every 15 minutes. Sends an SES
  # alert email when overall status is not "ok" with a 30-minute cooldown
  # backed by a sentinel item in JobsTable. Also exposes GET /admin/health
  # on UploadApi for the portal dashboard (auth handled in code).

  HealthCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: healthCheckHandler.handler
      Runtime: nodejs22.x
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          STACK_NAME: !Ref AWS::StackName
          JOBS_TABLE: !Ref JobsTable
          PROCESS_QUEUE_URL: !Ref ProcessQueue
          PROCESS_DLQ_URL: !Ref ProcessDLQ
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_KEY: !Ref SupabaseServiceKey
          SES_SENDER_EMAIL: !Ref HealthAlertSenderEmail
          HEALTH_ALERT_EMAIL: !Ref HealthAlertRecipientEmail
          COGNITO_ISSUER: !Ref CognitoIssuer
          COGNITO_AUDIENCE: !Ref CognitoAudience
          ADMIN_SUB_ALLOWLIST: !Ref AdminSubAllowlist
          ALLOWED_ORIGINS: !Join [",", !Ref AllowedOrigins]
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - cloudwatch:GetMetricStatistics
            Resource: "*"
        - Statement:
            Effect: Allow
            Action:
              - sqs:GetQueueAttributes
            Resource:
              - !GetAtt ProcessQueue.Arn
              - !GetAtt ProcessDLQ.Arn
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
            Resource: !GetAtt JobsTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: "*"
        - Statement:
            Effect: Allow
            Action:
              - lambda:ListFunctions
            Resource: "*"
      Events:
        HealthCheckSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Description: System health poll every 15 minutes
            Enabled: true
        AdminHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/health
            Method: GET

  # ── CloudWatch Alarms ──────────────────────────────────────────────────────

  UploadFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda errors for upload API handler.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref UploadFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - AlarmActionsEnabled
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue

  WorkerFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda errors for upload worker.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - AlarmActionsEnabled
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue

  UploadCompleteFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda errors for upload complete handler.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref UploadCompleteFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - AlarmActionsEnabled
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue

  ScanResultHandlerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda errors for scan result handler.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScanResultHandlerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - AlarmActionsEnabled
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue

  HealthCheckFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda errors for system health check.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref HealthCheckFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - AlarmActionsEnabled
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue

  # ── Marked Register OCR processor (Python, SQS-triggered) ─────────────────
  # Processes one PDF per invocation at 600dpi. Page images are deleted after
  # OCR to keep within the 4096 MB /tmp limit. Requires TesseractLayerArn.

  ProcessRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src_python/process_register/
      Handler: handler.handler
      Runtime: python3.12
      Timeout: 900
      # Lambda allocates vCPU in proportion to memory (~6 vCPUs at 10240MB),
      # which is required to run OCR_WORKERS (6) concurrent Tesseract workers.
      MemorySize: 10240
      EphemeralStorage:
        Size: 4096
      ReservedConcurrentExecutions: 100
      Layers: !If
        - TesseractLayerConfigured
        - - !Ref TesseractLayerArn
        - !Ref AWS::NoValue
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          UPLOADS_BUCKET: !Ref UploadsBucket
          COMBINE_FUNCTION_ARN: !GetAtt CombineRegisterFunction.Arn
          # The splitter enqueues chunk messages back onto ProcessQueue.
          PROCESS_QUEUE_URL: !Ref ProcessQueue
          # Chunk size (pages per chunk). CHUNK_PAGES=0 disables splitting and
          # runs the original serial path — the rollback switch (§10).
          CHUNK_PAGES: "20"
          # Concurrent OCR threads per chunk invocation.
          OCR_WORKERS: "6"
          # Greyscale rendering is opt-in until verified byte-identical (§5.8).
          OCR_GRAYSCALE: "false"
          # Default-off Defect C candidate. When enabled, retain only readable
          # rows and visually evidenced strikethrough inference; sequence-only
          # numeric gaps remain diagnostics and do not create elector rows.
          OCR_EVIDENCE_ONLY_GAP_INFERENCE: !Ref OcrEvidenceOnlyGapInference
          # Default-off row-classification candidate. Uses the cover legend and
          # election family to distinguish printed eligibility exclusions from
          # genuine polling marks; also rejects removed and numberless rows.
          OCR_ROW_ELIGIBILITY_FILTER: !Ref OcrRowEligibilityFilter
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_KEY: !Ref SupabaseServiceKey
          TESSDATA_PREFIX: /opt/tessdata
          LD_LIBRARY_PATH: /opt/lib
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
            Resource: !GetAtt JobsTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:Query
            Resource: !Sub "${JobsTable.Arn}/index/BatchIdIndex"
        - Statement:
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !Sub "${UploadsBucket.Arn}/uploads/*"
        - Statement:
            Effect: Allow
            Action:
              - s3:PutObject
            Resource: !Sub "${UploadsBucket.Arn}/outputs/*"
        - Statement:
            Effect: Allow
            Action:
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:ChangeMessageVisibility
              # The splitter enqueues chunk messages back onto ProcessQueue.
              - sqs:SendMessage
            Resource: !GetAtt ProcessQueue.Arn
        - Statement:
            Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource: !GetAtt CombineRegisterFunction.Arn
      Events:
        SQSSource:
          Type: SQS
          Properties:
            Queue: !GetAtt ProcessQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
            Enabled: true

  # ── Marked Register batch combiner (Python, direct invoke) ────────────────
  # Invoked async by ProcessRegisterFunction once all jobs in a batch complete.
  # Merges per-job JSON outputs into one text-safe XLSX workbook and emails it
  # or a download link.

  CombineRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src_python/combine_register/
      Handler: handler.handler
      Runtime: python3.12
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          ELECTIONS_TABLE: !Ref ElectionsTable
          UPLOADS_BUCKET: !Ref UploadsBucket
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_KEY: !Ref SupabaseServiceKey
          SES_SENDER_EMAIL: !Ref SesFromEmail
          SES_RECIPIENT_EMAIL: !Ref SesRecipientEmail
          PLATFORM_BASE_URL: !Ref PlatformBaseUrl
          # Leave headroom below SES's 10 MiB raw-message ceiling. The combiner
          # measures the fully encoded MIME message, not the workbook bytes.
          SES_MAX_RAW_EMAIL_BYTES: "9500000"
          # Large-result emails receive a temporary direct link; authenticated
          # portal downloads can mint a fresh 15-minute link at any time.
          DOWNLOAD_URL_TTL_SECONDS: "21600"
          # Within-source dedupe threshold (%). Exceeding it withholds the result
          # and sets batchStatus=QUALITY_REVIEW_REQUIRED.
          DEDUPE_WARN_PCT: "2"
          # Fail closed when too few row-bearing PDF pages have a readable,
          # anchored polling-district header.
          DISTRICT_HEADER_MIN_PCT: "20"
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:Query
            Resource: !Sub "${JobsTable.Arn}/index/BatchIdIndex"
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:UpdateItem
            Resource: !GetAtt JobsTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
            Resource: !GetAtt ElectionsTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "${UploadsBucket.Arn}/outputs/*"
        - Statement:
            Effect: Allow
            Action:
              # read_job_outputs() lists chunk objects with list_objects_v2, which
              # requires the bucket-level ListBucket action on the bucket ARN
              # (distinct from the /* object resource used above).
              - s3:ListBucket
            Resource: !GetAtt UploadsBucket.Arn
        - Statement:
            Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: "*"

  ProcessRegisterFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda errors for marked register OCR processor.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessRegisterFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - AlarmActionsEnabled
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue

  CombineRegisterFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda errors for marked register batch combiner.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CombineRegisterFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - AlarmActionsEnabled
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue

Outputs:
  ApiBaseUrl:
    Description: Base URL for the upload API (set as VITE_UPLOAD_API_URL in Amplify).
    Value: !Sub "https://${UploadApi}.execute-api.${AWS::Region}.amazonaws.com"
  UploadsBucketName:
    Description: Name of the S3 bucket for uploads and outputs.
    Value: !Ref UploadsBucket
  JobsTableName:
    Description: Name of the DynamoDB jobs table.
    Value: !Ref JobsTable
  UsersTableName:
    Description: Name of the DynamoDB users table.
    Value: !Ref UsersTable
  ElectionsTableName:
    Description: Name of the DynamoDB elections table.
    Value: !Ref ElectionsTable
  OrganisationsTableName:
    Description: Name of the DynamoDB organisations table.
    Value: !Ref OrganisationsTable
  AuditLogTableName:
    Description: Name of the DynamoDB audit log table.
    Value: !Ref AuditLogTable
  SubmissionsTableName:
    Description: Name of the DynamoDB submissions table.
    Value: !Ref SubmissionsTable
  ProcessQueueUrl:
    Description: URL of the processing SQS queue.
    Value: !Ref ProcessQueue
  ProcessQueueArn:
    Description: ARN of the processing SQS queue.
    Value: !GetAtt ProcessQueue.Arn
  ProcessDlqUrl:
    Description: URL of the processing dead-letter queue.
    Value: !Ref ProcessDLQ
  ProcessDlqArn:
    Description: ARN of the processing dead-letter queue.
    Value: !GetAtt ProcessDLQ.Arn
  PersonaApiUrl:
    Description: API Gateway base URL for MP Persona routes. Frontend uses VITE_UPLOAD_API_URL; do not use VITE_PERSONA_API_URL.
    Value: !Sub "https://${UploadApi}.execute-api.${AWS::Region}.amazonaws.com"
  ScanResultsRuleName:
    Condition: GuardDutyScanEnabled
    Description: EventBridge rule name for GuardDuty malware scan results.
    Value: !Ref ScanResultsRule
  WafWebAclArn:
    Condition: WafEnabledCondition
    Description: ARN of the WAF Web ACL protecting the upload API.
    Value: !GetAtt UploadWebAcl.Arn
  ProcessRegisterFunctionArn:
    Description: ARN of the marked register OCR processor Lambda.
    Value: !GetAtt ProcessRegisterFunction.Arn
  CombineRegisterFunctionArn:
    Description: ARN of the marked register batch combiner Lambda.
    Value: !GetAtt CombineRegisterFunction.Arn
