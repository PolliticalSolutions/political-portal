AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Political Solutions upload API (HTTP API + Lambda + S3 + DynamoDB).

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Description: SPA origins allowed by CORS (e.g. https://www.politicalsolutions.uk,http://localhost:5173).
  CognitoIssuer:
    Type: String
    Default: ""
    Description: Cognito issuer URL for JWT verification (e.g. https://cognito-idp.eu-west-2.amazonaws.com/<user-pool-id>).
  CognitoAudience:
    Type: String
    Default: ""
    Description: Cognito app client ID for JWT verification.
  AdminSubAllowlist:
    Type: String
    Default: ""
    Description: Comma-separated Cognito sub allowlist for admin endpoints.
  GeoLookupTableName:
    Type: String
    Default: ""
    Description: Existing geography lookup DynamoDB table name (PCON/WD mapping), managed outside this stack.
  EnableGuardDutyScan:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable GuardDuty Malware Protection for S3 scan gating.
  BypassScanWhenDisabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enqueue jobs directly when GuardDuty scan gating is disabled.
  AlarmTopicArn:
    Type: String
    Default: ""
    Description: Optional SNS topic ARN for CloudWatch alarms.
  ThrottlingRateLimit:
    Type: Number
    Default: 20
    Description: Steady-state request rate per second for the HTTP API stage.
  ThrottlingBurstLimit:
    Type: Number
    Default: 40
    Description: Burst limit for the HTTP API stage.
  WafEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable or disable AWS WAF protection.
  WafRateLimit:
    Type: Number
    Default: 300
    Description: WAF rate limit (requests per 5 minutes per IP).
  WafManagedRulesEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable or disable AWS Managed Rule Groups.
  WafLoggingEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable or disable WAF logging to CloudWatch Logs.
  WafLogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch Logs retention in days for WAF logs.

Conditions:
  WafEnabledCondition: !Equals [!Ref WafEnabled, "true"]
  WafManagedRulesEnabledCondition: !Equals [!Ref WafManagedRulesEnabled, "true"]
  GeoLookupConfigured: !Not [!Equals [!Ref GeoLookupTableName, ""]]
  WafLoggingOn: !And
    - !Condition WafEnabledCondition
    - !Equals [!Ref WafLoggingEnabled, "true"]
  AlarmActionsEnabled: !Not [!Equals [!Ref AlarmTopicArn, ""]]
  GuardDutyScanEnabled: !Equals [!Ref EnableGuardDutyScan, "true"]
  GuardDutyScanDisabled: !Not [!Condition GuardDutyScanEnabled]

Resources:

  # ── S3 bucket (uploads + outputs) ─────────────────────────────────────────

  UploadsBucket:
    Type: AWS::S3::Bucket
    DependsOn: ProcessQueueS3SendPolicy
    Properties:
      BucketName: !Sub "${AWS::StackName}-uploads-${AWS::AccountId}"
      AccessControl: Private
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref AllowedOrigins
            AllowedMethods: [POST, GET]
            AllowedHeaders: ["*"]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadsAfter90Days
            Status: Enabled
            Prefix: "uploads/"
            ExpirationInDays: 90
          - Id: ExpireOutputsAfter90Days
            Status: Enabled
            Prefix: "outputs/"
            ExpirationInDays: 90
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      NotificationConfiguration: !If
        - GuardDutyScanDisabled
        - QueueConfigurations:
            - Event: "s3:ObjectCreated:*"
              Queue: !GetAtt ProcessQueue.Arn
              Filter:
                S3Key:
                  Rules:
                    - Name: prefix
                      Value: "uploads/"
        - !Ref AWS::NoValue

  # ── DynamoDB table ─────────────────────────────────────────────────────────

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-jobs"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
        - AttributeName: userSub
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: s3Key
          AttributeType: S
        - AttributeName: manualReviewKey
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserSubIndex
          KeySchema:
            - AttributeName: userSub
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: S3KeyIndex
          KeySchema:
            - AttributeName: s3Key
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: ManualReviewIndex
          KeySchema:
            - AttributeName: manualReviewKey
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusCreatedAtIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ElectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-elections"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: electionId
          AttributeType: S
        - AttributeName: statusPconKey
          AttributeType: S
        - AttributeName: dateElectionKey
          AttributeType: S
      KeySchema:
        - AttributeName: electionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusPconDateIndex
          KeySchema:
            - AttributeName: statusPconKey
              KeyType: HASH
            - AttributeName: dateElectionKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  OrganisationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-organisations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orgId
          AttributeType: S
        - AttributeName: activeOrgTypeKey
          AttributeType: S
      KeySchema:
        - AttributeName: orgId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ActiveOrgTypeIndex
          KeySchema:
            - AttributeName: activeOrgTypeKey
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-audit-log"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: auditId
          AttributeType: S
        - AttributeName: actorId
          AttributeType: S
        - AttributeName: targetKey
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: auditId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ActorCreatedAtIndex
          KeySchema:
            - AttributeName: actorId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: TargetCreatedAtIndex
          KeySchema:
            - AttributeName: targetKey
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  SubmissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-submissions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: submissionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: submissionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdCreatedAtIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── Processing queues (scan-gated) ────────────────────────────────────────

  ProcessDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-process-dlq"
      MessageRetentionPeriod: 1209600

  ProcessQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-process-queue"
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProcessDLQ.Arn
        maxReceiveCount: 3

  ProcessQueueS3SendPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ProcessQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3SendMessageFromUploadsBucket
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ProcessQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:aws:s3:::${AWS::StackName}-uploads-${AWS::AccountId}"

  # ── HTTP API ───────────────────────────────────────────────────────────────

  UploadApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods:
          - GET
          - POST
          - PUT
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottlingRateLimit
        ThrottlingBurstLimit: !Ref ThrottlingBurstLimit

  # ── WAF ────────────────────────────────────────────────────────────────────

  UploadWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: WafEnabledCondition
    Properties:
      Name: !Sub "${AWS::StackName}-upload-waf"
      Description: WAF protections for the upload HTTP API.
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: upload-waf
        SampledRequestsEnabled: true
      Rules:
        - Name: RateLimitPerIP
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimit
              AggregateKeyType: IP
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: upload-waf-rate-limit
            SampledRequestsEnabled: true
        - !If
          - WafManagedRulesEnabledCondition
          - Name: AWSManagedRulesCommonRuleSet
            Priority: 1
            OverrideAction:
              None: {}
            Statement:
              ManagedRuleGroupStatement:
                VendorName: AWS
                Name: AWSManagedRulesCommonRuleSet
            VisibilityConfig:
              CloudWatchMetricsEnabled: true
              MetricName: upload-waf-common
              SampledRequestsEnabled: true
          - !Ref AWS::NoValue
        - !If
          - WafManagedRulesEnabledCondition
          - Name: AWSManagedRulesKnownBadInputsRuleSet
            Priority: 2
            OverrideAction:
              None: {}
            Statement:
              ManagedRuleGroupStatement:
                VendorName: AWS
                Name: AWSManagedRulesKnownBadInputsRuleSet
            VisibilityConfig:
              CloudWatchMetricsEnabled: true
              MetricName: upload-waf-bad-inputs
              SampledRequestsEnabled: true
          - !Ref AWS::NoValue
        - !If
          - WafManagedRulesEnabledCondition
          - Name: AWSManagedRulesAmazonIpReputationList
            Priority: 3
            OverrideAction:
              None: {}
            Statement:
              ManagedRuleGroupStatement:
                VendorName: AWS
                Name: AWSManagedRulesAmazonIpReputationList
            VisibilityConfig:
              CloudWatchMetricsEnabled: true
              MetricName: upload-waf-ip-reputation
              SampledRequestsEnabled: true
          - !Ref AWS::NoValue

  UploadWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: WafEnabledCondition
    Properties:
      WebACLArn: !GetAtt UploadWebAcl.Arn
      ResourceArn: !Sub "arn:aws:apigateway:${AWS::Region}::/apis/${UploadApi}/stages/$default"

  UploadWafLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: WafLoggingOn
    Properties:
      LogGroupName: !Sub "/aws/waf/${AWS::StackName}"
      RetentionInDays: !Ref WafLogRetentionDays

  UploadWafLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Condition: WafLoggingOn
    Properties:
      ResourceArn: !GetAtt UploadWebAcl.Arn
      LogDestinationConfigs:
        - !GetAtt UploadWafLogGroup.Arn

  # ── API Lambda ─────────────────────────────────────────────────────────────

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.handler
      Runtime: nodejs20.x
      Timeout: 29
      MemorySize: 256
      Environment:
        Variables:
          ALLOWED_ORIGINS: !Join [",", !Ref AllowedOrigins]
          JOBS_TABLE: !Ref JobsTable
          USERS_TABLE: !Ref UsersTable
          ELECTIONS_TABLE: !Ref ElectionsTable
          SUBMISSIONS_TABLE: !Ref SubmissionsTable
          ORGANISATIONS_TABLE: !Ref OrganisationsTable
          AUDIT_TABLE: !Ref AuditLogTable
          GEO_LOOKUP_TABLE: !Ref GeoLookupTableName
          GEO_LOOKUP_MODE: "auto"
          GEO_LOOKUP_WARD_KEY_ATTR: "wardCode"
          GEO_LOOKUP_PCON_ATTR: "pconCode"
          GEO_LOOKUP_PK_ATTR: "pk"
          GEO_LOOKUP_SK_ATTR: "sk"
          GEO_LOOKUP_WARD_PK_PREFIX: "WARD#"
          UPLOADS_BUCKET: !Ref UploadsBucket
          COGNITO_ISSUER: !Ref CognitoIssuer
          COGNITO_AUDIENCE: !Ref CognitoAudience
          ADMIN_SUB_ALLOWLIST: !Ref AdminSubAllowlist
          ENABLE_GUARDDUTY_SCAN: !Ref EnableGuardDutyScan
          BYPASS_SCAN_WHEN_DISABLED: !Ref BypassScanWhenDisabled
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:DeleteItem
            Resource:
              - !GetAtt JobsTable.Arn
              - !Sub "${JobsTable.Arn}/index/UserSubIndex"
              - !Sub "${JobsTable.Arn}/index/S3KeyIndex"
              - !Sub "${JobsTable.Arn}/index/ManualReviewIndex"
              - !GetAtt UsersTable.Arn
              - !Sub "${UsersTable.Arn}/index/StatusCreatedAtIndex"
              - !GetAtt ElectionsTable.Arn
              - !Sub "${ElectionsTable.Arn}/index/StatusPconDateIndex"
              - !GetAtt SubmissionsTable.Arn
              - !Sub "${SubmissionsTable.Arn}/index/UserIdCreatedAtIndex"
              - !GetAtt OrganisationsTable.Arn
              - !Sub "${OrganisationsTable.Arn}/index/ActiveOrgTypeIndex"
              - !GetAtt AuditLogTable.Arn
        - !If
          - GeoLookupConfigured
          - Statement:
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${GeoLookupTableName}"
          - !Ref AWS::NoValue
        - Statement:
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource: !Sub "${UploadsBucket.Arn}/*"
      Events:
        JobsPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /jobs
            Method: POST
        JobsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /jobs
            Method: GET
        JobsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /jobs/{jobId}
            Method: GET
        JobsDownload:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /jobs/{jobId}/download
            Method: GET
        ElectionsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /elections
            Method: GET
        OrganisationsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /organisations
            Method: GET
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /me
            Method: GET
        AdminElectionsCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/elections
            Method: POST
        AdminElectionsUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/elections/{electionId}
            Method: PUT
        AdminElectionsArchive:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/elections/{electionId}/archive
            Method: POST
        AdminMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/me
            Method: GET
        AdminUsersList:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/users
            Method: GET
        ManualReviewJobsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/manual-review/jobs
            Method: GET
        ManualReviewJobGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/manual-review/jobs/{jobId}
            Method: GET
        ManualReviewJobResolve:
          Type: HttpApi
          Properties:
            ApiId: !Ref UploadApi
            Path: /admin/manual-review/jobs/{jobId}/resolve
            Method: POST

  # ── Worker Lambda (S3 trigger) ─────────────────────────────────────────────

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: worker.handler
      Runtime: nodejs20.x
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          USERS_TABLE: !Ref UsersTable
          ELECTIONS_TABLE: !Ref ElectionsTable
          SUBMISSIONS_TABLE: !Ref SubmissionsTable
          GEO_LOOKUP_TABLE: !Ref GeoLookupTableName
          UPLOADS_BUCKET: !Ref UploadsBucket
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:UpdateItem
            Resource: !GetAtt JobsTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:Query
            Resource:
              - !Sub "${JobsTable.Arn}/index/S3KeyIndex"
        - Statement:
            Effect: Allow
            Action:
              - s3:HeadObject
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "${UploadsBucket.Arn}/*"
        - Statement:
            Effect: Allow
            Action:
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:ChangeMessageVisibility
            Resource: !GetAtt ProcessQueue.Arn

  WorkerProcessQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 10
      EventSourceArn: !GetAtt ProcessQueue.Arn
      FunctionName: !Ref WorkerFunction
      FunctionResponseTypes:
        - ReportBatchItemFailures
      Enabled: true

  # ── Scan result handler (GuardDuty -> EventBridge -> Lambda -> SQS) ───────

  ScanResultHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: scanResultHandler.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          USERS_TABLE: !Ref UsersTable
          ELECTIONS_TABLE: !Ref ElectionsTable
          SUBMISSIONS_TABLE: !Ref SubmissionsTable
          GEO_LOOKUP_TABLE: !Ref GeoLookupTableName
          PROCESS_QUEUE_URL: !Ref ProcessQueue
          UPLOADS_BUCKET: !Ref UploadsBucket
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:Query
            Resource:
              - !GetAtt JobsTable.Arn
              - !Sub "${JobsTable.Arn}/index/S3KeyIndex"
        - Statement:
            Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt ProcessQueue.Arn

  ScanResultsRule:
    Type: AWS::Events::Rule
    Condition: GuardDutyScanEnabled
    Properties:
      Description: Route GuardDuty malware scan results for upload objects.
      EventPattern:
        source:
          - aws.guardduty
        detail-type:
          - GuardDuty Malware Protection Object Scan Result
        detail:
          s3ObjectDetails:
            bucketName:
              - !Ref UploadsBucket
      Targets:
        - Arn: !GetAtt ScanResultHandlerFunction.Arn
          Id: ScanResultHandlerTarget

  ScanResultHandlerInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: GuardDutyScanEnabled
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ScanResultHandlerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScanResultsRule.Arn

  # ── GuardDuty Malware Protection plan for uploads/ prefix ─────────────────

  MalwareProtectionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: malware-protection-plan.guardduty.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GuardDutyMalwareProtectionS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObjectTagging
                  - s3:PutObjectVersionTagging
                Resource:
                  - !Sub "${UploadsBucket.Arn}/uploads/*"
              - Effect: Allow
                Action:
                  - s3:GetBucketNotification
                  - s3:PutBucketNotification
                  - s3:GetBucketNotificationConfiguration
                  - s3:PutBucketNotificationConfiguration
                  - s3:GetBucketLocation
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                Resource: !GetAtt UploadsBucket.Arn
              - Effect: Allow
                Action:
                  - events:PutRule
                  - events:DeleteRule
                  - events:PutTargets
                  - events:RemoveTargets
                Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*"
              - Effect: Allow
                Action:
                  - events:DescribeRule
                  - events:ListTargetsByRule
                Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${UploadsBucket.Arn}/malware-protection-resource-validation-object"

  UploadsMalwareProtectionPlan:
    Type: AWS::GuardDuty::MalwareProtectionPlan
    Condition: GuardDutyScanEnabled
    Properties:
      Role: !GetAtt MalwareProtectionRole.Arn
      ProtectedResource:
        S3Bucket:
          BucketName: !Ref UploadsBucket
          ObjectPrefixes:
            - "uploads/"
      Actions:
        Tagging:
          Status: ENABLED

  # ── CloudWatch Alarms ──────────────────────────────────────────────────────

  UploadFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda errors for upload API handler.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref UploadFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - AlarmActionsEnabled
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue

  WorkerFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda errors for upload worker.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - AlarmActionsEnabled
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue

  ScanResultHandlerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda errors for scan result handler.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScanResultHandlerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - AlarmActionsEnabled
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue

Outputs:
  ApiBaseUrl:
    Description: Base URL for the upload API (set as VITE_UPLOAD_API_URL in Amplify).
    Value: !Sub "https://${UploadApi}.execute-api.${AWS::Region}.amazonaws.com"
  UploadsBucketName:
    Description: Name of the S3 bucket for uploads and outputs.
    Value: !Ref UploadsBucket
  JobsTableName:
    Description: Name of the DynamoDB jobs table.
    Value: !Ref JobsTable
  UsersTableName:
    Description: Name of the DynamoDB users table.
    Value: !Ref UsersTable
  ElectionsTableName:
    Description: Name of the DynamoDB elections table.
    Value: !Ref ElectionsTable
  OrganisationsTableName:
    Description: Name of the DynamoDB organisations table.
    Value: !Ref OrganisationsTable
  AuditLogTableName:
    Description: Name of the DynamoDB audit log table.
    Value: !Ref AuditLogTable
  SubmissionsTableName:
    Description: Name of the DynamoDB submissions table.
    Value: !Ref SubmissionsTable
  ProcessQueueUrl:
    Description: URL of the processing SQS queue.
    Value: !Ref ProcessQueue
  ProcessQueueArn:
    Description: ARN of the processing SQS queue.
    Value: !GetAtt ProcessQueue.Arn
  ProcessDlqUrl:
    Description: URL of the processing dead-letter queue.
    Value: !Ref ProcessDLQ
  ProcessDlqArn:
    Description: ARN of the processing dead-letter queue.
    Value: !GetAtt ProcessDLQ.Arn
  ScanResultsRuleName:
    Condition: GuardDutyScanEnabled
    Description: EventBridge rule name for GuardDuty malware scan results.
    Value: !Ref ScanResultsRule
  WafWebAclArn:
    Condition: WafEnabledCondition
    Description: ARN of the WAF Web ACL protecting the upload API.
    Value: !GetAtt UploadWebAcl.Arn
