name: Apply Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**.sql'
  # Allow manual trigger with an optional dry-run mode.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print SQL without applying)'
        required: false
        type: boolean
        default: false

# Serialise runs so two merges arriving in quick succession can't race
# against the same migration history table.
concurrency:
  group: supabase-migrations-prod
  cancel-in-progress: false

jobs:
  apply-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is not needed; the migrations live in the working tree.
          fetch-depth: 1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Extract Supabase project ref from VITE_SUPABASE_URL
        id: project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_SUPABASE_URL:-}" ]; then
            echo "::error title=Missing secret::VITE_SUPABASE_URL is not set as a repository secret. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          host="${VITE_SUPABASE_URL#https://}"
          host="${host#http://}"
          ref="${host%%.*}"
          if [ -z "$ref" ] || [ "$ref" = "$host" ]; then
            echo "::error title=Bad VITE_SUPABASE_URL::Could not parse a project ref from '$VITE_SUPABASE_URL'. Expected form: https://<ref>.supabase.co"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "::notice title=Project ref::Resolved Supabase project ref: $ref"

      - name: Verify required secrets are present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && missing+=("SUPABASE_ACCESS_TOKEN")
          [ -z "${SUPABASE_DB_PASSWORD:-}" ]  && missing+=("SUPABASE_DB_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing secrets::These repository secrets are not set: ${missing[*]}"
            exit 1
          fi

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref "${{ steps.project.outputs.ref }}"

      - name: Apply migrations (live)
        if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::notice::Applying migrations to project ${{ steps.project.outputs.ref }}"
          supabase db push

      - name: Apply migrations (dry run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::notice::Dry-run mode — no changes will be applied."
          supabase db push --dry-run
