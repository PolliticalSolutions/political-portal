version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: Strict-Transport-Security
          value: max-age=31536000; includeSubDomains
        - key: X-Content-Type-Options
          value: nosniff
        - key: X-Frame-Options
          value: DENY
        - key: Referrer-Policy
          value: strict-origin-when-cross-origin
        - key: Permissions-Policy
          value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
    - pattern: index.html
      headers:
        - key: Cache-Control
          value: no-store, max-age=0, must-revalidate
    - pattern: assets/*
      headers:
        - key: Cache-Control
          value: public, max-age=31536000, immutable
    - pattern: robots.txt
      headers:
        - key: Cache-Control
          value: public, max-age=3600
    - pattern: sitemap.xml
      headers:
        - key: Cache-Control
          value: public, max-age=3600
