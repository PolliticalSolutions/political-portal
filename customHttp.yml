customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - key: Content-Security-Policy-Report-Only
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://rn06rrhtfe.execute-api.eu-west-2.amazonaws.com https://*.amazoncognito.com https://*.auth.eu-west-2.amazoncognito.com; form-action 'self'; upgrade-insecure-requests;"
  - pattern: '/'
    headers:
      - key: Cache-Control
        value: public, max-age=0, s-maxage=600, must-revalidate
  - pattern: '/services'
    headers:
      - key: Cache-Control
        value: public, max-age=0, s-maxage=600, must-revalidate
  - pattern: '/services/election-support'
    headers:
      - key: Cache-Control
        value: public, max-age=0, s-maxage=600, must-revalidate
  - pattern: '/subscriptions'
    headers:
      - key: Cache-Control
        value: public, max-age=0, s-maxage=600, must-revalidate
  - pattern: '/enquire'
    headers:
      - key: Cache-Control
        value: public, max-age=0, s-maxage=600, must-revalidate
  - pattern: '/privacy'
    headers:
      - key: Cache-Control
        value: public, max-age=0, s-maxage=600, must-revalidate
  - pattern: '/terms'
    headers:
      - key: Cache-Control
        value: public, max-age=0, s-maxage=600, must-revalidate
  - pattern: '/cookies'
    headers:
      - key: Cache-Control
        value: public, max-age=0, s-maxage=600, must-revalidate
  - pattern: index.html
    headers:
      - key: Cache-Control
        value: public, max-age=0, s-maxage=600, must-revalidate
  - pattern: assets/*
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: '*.geojson'
    headers:
      - key: Cache-Control
        value: public, max-age=86400
      - key: Content-Type
        value: application/geo+json
  - pattern: '**/*.map'
    headers:
      - key: Cache-Control
        value: no-store, max-age=0, must-revalidate
  - pattern: robots.txt
    headers:
      - key: Cache-Control
        value: public, max-age=3600
  - pattern: sitemap.xml
    headers:
      - key: Cache-Control
        value: public, max-age=3600
